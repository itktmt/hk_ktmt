<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HK Ktmt Inspection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: staff = phone-first single column with bottom nav; supervisor/admin = slate sidebar + card dashboard */
:root{
  --bg:#EDF2F1; --surface:#FFFFFF; --surface-2:#F4F7F7; --surface-3:#E6EDEC; --line:#D9E3E2;
  --ink:#0E2230; --ink-2:#465A66; --muted:#788A93;
  --slate:#13293D; --slate-2:#1B3850; --slate-ink:#E8F0F3; --side-muted:#93A7B4;
  --emerald:#0B9468; --emerald-ink:#FFFFFF; --emerald-soft:#DAF3E8; --emerald-txt:#06684A;
  --cyan:#0784A6; --cyan-soft:#D9EFF6; --cyan-txt:#055E78;
  --amber:#C47A0A; --amber-soft:#FCEFD6; --amber-txt:#8A5404;
  --rose:#CF3F45; --rose-soft:#FBE2E2; --rose-txt:#9C2328;
  --violet:#6552C9; --violet-soft:#EAE6FB; --violet-txt:#46379A;
  --gray-soft:#E8EEF0; --gray-txt:#55656F;
  --overlay:rgba(9,20,28,.55);
  --shadow-sm:0 1px 2px rgba(14,34,48,.06);
  --shadow:0 1px 2px rgba(14,34,48,.05),0 12px 30px -16px rgba(14,34,48,.25);
  --shadow-lg:0 30px 70px -24px rgba(8,20,30,.5);
  --r-sm:10px; --r:16px; --r-lg:22px;
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A151D; --surface:#11202B; --surface-2:#152835; --surface-3:#1B3140; --line:#22394A;
  --ink:#E4EDF1; --ink-2:#A6B8C3; --muted:#7A8F9C;
  --slate:#071018; --slate-2:#10222F; --slate-ink:#E4EDF1; --side-muted:#7F95A3;
  --emerald:#2DBE8A; --emerald-ink:#03271A; --emerald-soft:rgba(45,190,138,.16); --emerald-txt:#62D9A9;
  --cyan:#2AA9CC; --cyan-soft:rgba(42,169,204,.16); --cyan-txt:#72CDE7;
  --amber:#E0A23A; --amber-soft:rgba(224,162,58,.16); --amber-txt:#F0C274;
  --rose:#EE6A6F; --rose-soft:rgba(238,106,111,.16); --rose-txt:#F59DA1;
  --violet:#9A8BF0; --violet-soft:rgba(154,139,240,.16); --violet-txt:#BDB2F7;
  --gray-soft:rgba(160,180,190,.12); --gray-txt:#A6B8C3; --overlay:rgba(0,0,0,.65);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A151D; --surface:#11202B; --surface-2:#152835; --surface-3:#1B3140; --line:#22394A;
  --ink:#E4EDF1; --ink-2:#A6B8C3; --muted:#7A8F9C;
  --slate:#071018; --slate-2:#10222F; --slate-ink:#E4EDF1; --side-muted:#7F95A3;
  --emerald:#2DBE8A; --emerald-ink:#03271A; --emerald-soft:rgba(45,190,138,.16); --emerald-txt:#62D9A9;
  --cyan:#2AA9CC; --cyan-soft:rgba(42,169,204,.16); --cyan-txt:#72CDE7;
  --amber:#E0A23A; --amber-soft:rgba(224,162,58,.16); --amber-txt:#F0C274;
  --rose:#EE6A6F; --rose-soft:rgba(238,106,111,.16); --rose-txt:#F59DA1;
  --violet:#9A8BF0; --violet-soft:rgba(154,139,240,.16); --violet-txt:#BDB2F7;
  --gray-soft:rgba(160,180,190,.12); --gray-txt:#A6B8C3; --overlay:rgba(0,0,0,.65);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7); color-scheme:dark;
}
*{box-sizing:border-box}
/* base reset so the file also works when hosted on its own (outside Claude) */
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ic{width:18px;height:18px;flex:none;stroke-width:2}
.ic-sm{width:15px;height:15px}
.ic-lg{width:22px;height:22px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(140deg,var(--emerald),var(--cyan));color:#fff;flex:none;box-shadow:0 6px 16px -8px var(--emerald)}
.brand b{font-size:15px;font-weight:800;letter-spacing:-.02em;display:block}
.brand small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-clock{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);padding:6px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.tb-clock .mono{font-weight:700;color:var(--ink)}
.role-wrap{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.role-wrap label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.role-wrap select{font:inherit;font-weight:700;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;max-width:220px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);flex:none;transition:transform .15s,background .15s}
.icon-btn:hover{background:var(--surface-2);transform:translateY(-1px)}
@media (max-width:760px){.tb-clock,.brand small{display:none}.role-wrap label{display:none}.role-wrap select{max-width:170px}}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.card-pad{padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:15px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 16px;font-weight:700;font-size:13.5px;border:1px solid transparent;transition:transform .12s,box-shadow .15s,background .15s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--emerald);color:var(--emerald-ink);box-shadow:0 8px 18px -10px var(--emerald)}
.btn-primary:hover{box-shadow:0 10px 22px -10px var(--emerald)}
.btn-primary:disabled{opacity:.45;box-shadow:none}
.btn-danger{background:var(--rose);color:#fff}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.btn-block{width:100%}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1.5}
.badge .ic{width:13px;height:13px}
.b-gray{background:var(--gray-soft);color:var(--gray-txt)}
.b-cyan{background:var(--cyan-soft);color:var(--cyan-txt)}
.b-violet{background:var(--violet-soft);color:var(--violet-txt)}
.b-emerald{background:var(--emerald-soft);color:var(--emerald-txt)}
.b-rose{background:var(--rose-soft);color:var(--rose-txt)}
.b-amber{background:var(--amber-soft);color:var(--amber-txt)}
.tag{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:6px;background:var(--rose-soft);color:var(--rose-txt)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:12.5px;color:var(--ink-2);white-space:nowrap;transition:all .15s}
.chip.on{background:var(--slate);border-color:var(--slate);color:var(--slate-ink)}
.chip .cnt{font-size:11px;font-weight:800;padding:0 6px;border-radius:999px;background:var(--surface-3);color:var(--ink-2)}
.chip.on .cnt{background:rgba(255,255,255,.18);color:inherit}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-3);gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;font-weight:700;font-size:12.5px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.avatar{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none;letter-spacing:.02em}
.avatar.sm{width:28px;height:28px;border-radius:9px;font-size:11px}
.avatar.lg{width:56px;height:56px;border-radius:18px;font-size:19px}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{padding:36px 20px;text-align:center;color:var(--muted);display:grid;justify-items:center;gap:8px}
.empty .ic{width:34px;height:34px;color:var(--line)}
.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;display:flex}
.bar>span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block}
.chart .ch-t{fill:var(--muted);font-size:10.5px;font-family:var(--f-ui)}
.chart .ch-g{stroke:var(--line);stroke-width:1}
.chart .ch-v{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--f-ui)}
.tbl-wrap{overflow-x:auto;border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
input[type=text],textarea,select.inp{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:76px}
input[type=text]:focus,textarea:focus,select.inp:focus{outline:2px solid var(--cyan);outline-offset:0;border-color:transparent}

/* ---------- staff (mobile) ---------- */
.staff-wrap{display:flex;justify-content:center;gap:28px;padding:20px 16px 40px;align-items:flex-start}
.phone{width:100%;max-width:440px;position:relative;padding-bottom:84px}
.staff-aside{display:none;width:320px;position:sticky;top:84px}
@media (min-width:980px){
  .staff-aside{display:block}
  .phone{background:var(--surface-2);border:1px solid var(--line);border-radius:34px;padding:16px 14px 92px;box-shadow:var(--shadow-lg);min-height:760px}
  .phone .bottom-nav{position:absolute;bottom:12px;left:12px;right:12px;width:auto;transform:none}
}
.s-hero{background:linear-gradient(150deg,var(--slate) 0%,var(--slate-2) 70%,color-mix(in srgb,var(--emerald) 35%,var(--slate-2)) 100%);color:var(--slate-ink);border-radius:var(--r-lg);padding:18px;position:relative;overflow:hidden}
.s-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--cyan) 45%,transparent),transparent 70%);pointer-events:none}
.s-hero .eyebrow{color:var(--side-muted)}
.s-hero h1{font-size:24px;font-weight:800;margin-top:2px}
.lock-chip{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);font-size:12px;font-weight:700}
.s-prog{display:flex;gap:16px;align-items:center;margin-top:16px;position:relative;z-index:1}
.s-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;flex:1}
.s-stat{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 10px}
.s-stat b{font-size:18px;display:block;font-variant-numeric:tabular-nums}
.s-stat span{font-size:11px;color:var(--side-muted)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.sec-title h2{font-size:15px;font-weight:800}
.slot-h{display:flex;align-items:center;gap:10px;margin:16px 2px 8px;font-size:12px;font-weight:700;color:var(--muted)}
.slot-h .mono{color:var(--ink);font-size:13px}
.slot-h::after{content:"";flex:1;height:1px;background:var(--line)}
.task-card{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s,border-color .15s}
.task-card+.task-card{margin-top:8px}
.task-card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.task-card.st-rejected{border-color:color-mix(in srgb,var(--rose) 45%,var(--line))}
.tc-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.tc-body{flex:1;min-width:0;display:grid;gap:3px}
.tc-body b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-body small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tc-right{display:grid;justify-items:end;gap:4px}
.ty-toilet{background:var(--cyan-soft);color:var(--cyan-txt)}
.ty-lobby{background:var(--violet-soft);color:var(--violet-txt)}
.ty-pantry{background:var(--amber-soft);color:var(--amber-txt)}
.ty-meeting{background:var(--emerald-soft);color:var(--emerald-txt)}
.ty-corridor{background:var(--gray-soft);color:var(--gray-txt)}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--rose-soft);color:var(--rose-txt);font-size:13px;align-items:flex-start}
.alert b{display:block}
.alert.info{background:var(--cyan-soft);color:var(--cyan-txt)}
.alert.warn{background:var(--amber-soft);color:var(--amber-txt)}
.alert.ok{background:var(--emerald-soft);color:var(--emerald-txt)}
.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:420px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:20}
.bottom-nav button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:8px 4px;border-radius:14px;font-size:11px;font-weight:700;color:var(--muted);transition:all .15s}
.bottom-nav button.on{background:var(--emerald-soft);color:var(--emerald-txt)}
.aside-card{padding:18px}
.aside-card h3{font-size:15px;font-weight:800;margin:6px 0}
.fl-lock{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px dashed var(--line);margin-top:8px;font-size:13px}
.fl-lock.open{border-style:solid;border-color:color-mix(in srgb,var(--emerald) 50%,var(--line));background:var(--emerald-soft);color:var(--emerald-txt);font-weight:700}
.fl-lock.closed{color:var(--muted)}

/* ---------- sheet / modal ---------- */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.modal{background:var(--bg);width:100%;max-height:100%;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:up .25s cubic-bezier(.2,.8,.2,1)}
.m-phone{height:100%;max-width:460px}
.m-wide,.m-mid{height:100%}
@media (min-width:700px){
  .overlay{align-items:center;padding:24px}
  .modal{border-radius:24px;overflow:hidden}
  .m-phone{height:min(860px,100%)}
  .m-wide{max-width:1040px;height:min(900px,100%)}
  .m-mid{max-width:720px;height:auto;max-height:min(860px,100%)}
}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sheet-head{display:flex;align-items:center;gap:12px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-head .ttl{flex:1;min-width:0}
.sheet-head h2{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head small{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center}
.sheet-body{flex:1;overflow-y:auto;padding:16px;display:grid;gap:14px;align-content:start}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:grid;gap:8px}
.miss{font-size:12px;color:var(--amber-txt);display:flex;gap:6px;align-items:flex-start}
.okmsg{font-size:12px;color:var(--emerald-txt);display:flex;gap:6px;align-items:center;font-weight:700}
.meta-row{display:flex;gap:8px;flex-wrap:wrap}
.meta-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-2)}
.meta-pill b{color:var(--ink)}
.step-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sec-h{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.sec-h .n{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--surface-3);font-weight:800;font-size:13px;flex:none}
.sec-h .n.done{background:var(--emerald);color:var(--emerald-ink)}
.sec-h h3{font-size:14.5px;font-weight:800}
.sec-h p{font-size:12px;color:var(--muted)}
.sec-h .right{margin-left:auto}
.step{width:100%;display:flex;gap:10px;text-align:left;border:0;background:transparent;padding:9px 6px;border-radius:12px;align-items:flex-start}
.step:hover{background:var(--surface-2)}
.step .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;margin-top:1px;transition:all .15s}
.step.done .ck{background:var(--emerald);border-color:var(--emerald);color:var(--emerald-ink)}
.step .ck .ic{width:14px;height:14px;opacity:0}
.step.done .ck .ic{opacity:1}
.step b{font-size:13.5px;display:block}
.step span{font-size:12.5px;color:var(--muted);display:block}
.step.done b{color:var(--ink-2)}
.ck-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.ck-row:first-of-type{border-top:0}
.ck-l{flex:1;min-width:0;font-size:13.5px;font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg2{display:flex;gap:4px;flex:none}
.seg2 button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-weight:700;font-size:12px;color:var(--ink-2);display:inline-flex;gap:4px;align-items:center}
.seg2 button.on.ok{background:var(--emerald);border-color:var(--emerald);color:var(--emerald-ink)}
.seg2 button.on.no{background:var(--rose);border-color:var(--rose);color:#fff}
.seg2 button:disabled{opacity:.8}
.ph{margin:0;position:relative;border-radius:14px;overflow:hidden;background:var(--surface-3);aspect-ratio:4/3;max-width:100%}

.ph .ph-act button{background:rgba(6,18,26,.7);color:#fff;border:0;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;display:inline-flex;gap:5px;align-items:center;backdrop-filter:blur(6px)}
.block-open{border-style:dashed;color:var(--ink-2)}
.block-sec{border-color:color-mix(in srgb,var(--amber) 45%,var(--line))}
.block-sec .sec-h .n{background:var(--amber-soft);color:var(--amber-txt)}
.reason-list{display:grid;gap:6px;margin-bottom:8px}
.reason{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-weight:600;font-size:13px}
.reason .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.reason.on{border-color:var(--amber);background:var(--amber-soft);color:var(--amber-txt)}
.reason.on .rd{border:5px solid var(--amber)}
.blk-actions{display:grid;gap:10px}
.blk-card{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--surface-2)}
.blk-card b{display:flex;gap:6px;align-items:center;font-size:13.5px}
.blk-card p{font-size:12.5px;color:var(--muted)}
.blk-card small{font-size:11.5px}
.ph-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.ph-grid .ph .ph-act button{padding:6px 8px}
.ph-num{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:rgba(6,18,26,.72);color:#fff;font-variant-numeric:tabular-nums}
.ph-add{border:2px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;aspect-ratio:4/3;max-width:100%;background:var(--surface-2);text-align:center}

.ph-add small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ph-empty{border:2px dashed var(--line);border-radius:14px;padding:22px 14px;display:grid;justify-items:center;gap:10px;text-align:center;background:var(--surface-2)}

.ph-empty p{font-size:12.5px;color:var(--muted);max-width:30ch}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.timeline{display:grid;gap:10px}
.tl-item{display:flex;gap:10px;font-size:13px}
.tl-dot{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.tl-item small{color:var(--muted);display:block;font-size:11.5px}

/* ---------- camera ---------- */
.cam{position:fixed;inset:0;z-index:80;background:#060D12;color:#fff;display:flex;flex-direction:column;animation:fade .2s}
.cam-top{display:flex;align-items:center;gap:12px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.cam-top .t{flex:1;font-weight:700;font-size:14px}
.cam-top .t small{display:block;font-weight:500;color:#9FB3BF;font-size:11.5px}
.cam-x{width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;padding:4px 9px;border-radius:999px;background:rgba(207,63,69,.2);color:#FF9A9E}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#FF5A60;animation:blink 1.2s infinite}
.live.sim{background:rgba(224,162,58,.2);color:#F0C274}
.live.sim::before{background:#F0C274;animation:none}
.cam-frame video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@keyframes blink{50%{opacity:.25}}
.cam-view{flex:1;display:grid;place-items:center;padding:0 12px;min-height:0}
.cam-frame{position:relative;width:100%;max-width:820px;aspect-ratio:4/3;max-height:100%;border-radius:18px;overflow:hidden;background:#000}
.cam-frame canvas,.cam-frame img{width:100%;height:100%;display:block;object-fit:contain}
.brk{position:absolute;width:34px;height:34px;border-color:rgba(255,255,255,.85);border-style:solid;pointer-events:none}
.brk.tl{left:14%;top:16%;border-width:3px 0 0 3px;border-radius:8px 0 0 0}
.brk.tr{right:14%;top:16%;border-width:3px 3px 0 0;border-radius:0 8px 0 0}
.brk.bl{left:14%;bottom:36%;border-width:0 0 3px 3px;border-radius:0 0 0 8px}
.brk.br{right:14%;bottom:36%;border-width:0 3px 3px 0;border-radius:0 0 8px 0}
.cam-hint{text-align:center;font-size:12px;color:#9FB3BF;padding:10px 16px 0;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.cam-ctrl{display:flex;align-items:center;justify-content:space-around;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));gap:12px}
.cam-side{width:52px;height:52px;border-radius:16px;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;position:relative;overflow:hidden}
.cam-side input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid rgba(255,255,255,.9);background:#fff;box-shadow:inset 0 0 0 4px #060D12;transition:transform .1s}
.shutter:active{transform:scale(.92)}
.shutter:disabled{opacity:.35;transform:none}
.cam-spacer{background:transparent;pointer-events:none}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.cam-flash.go{animation:flash .35s ease}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.cam-review{display:flex;gap:10px;justify-content:center;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));flex-wrap:wrap}
.cam-review .btn-ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.15)}

/* ---------- shell (supervisor/admin) ---------- */
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:calc(100vh - 57px)}
.side{background:var(--slate);color:var(--slate-ink);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto}
.side .eyebrow{color:var(--side-muted);padding:6px 10px 8px}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:var(--side-muted);padding:10px 12px;border-radius:12px;font-weight:600;font-size:13.5px;text-align:left;transition:all .15s}
.nav-btn:hover{background:rgba(255,255,255,.06);color:var(--slate-ink)}
.nav-btn.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--emerald)}
.nav-btn .nb{margin-left:auto;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--emerald);color:var(--emerald-ink)}
.side-foot{margin-top:auto;padding:12px;border-radius:14px;background:rgba(255,255,255,.06);display:flex;gap:10px;align-items:center}
.side-foot b{display:block;font-size:13px;color:#fff}
.side-foot small{font-size:11.5px;color:var(--side-muted)}
.main{padding:24px clamp(16px,3vw,32px) 48px;min-width:0}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-h h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.page-h p{color:var(--muted);margin-top:4px;max-width:65ch}
@media (max-width:900px){
  .shell{display:block}
  .side{position:sticky;top:57px;z-index:15;height:auto;flex-direction:row;overflow-x:auto;padding:8px 12px;gap:4px;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .side .eyebrow,.side-foot{display:none}
  .nav-btn{width:auto;white-space:nowrap;padding:8px 12px}
  .nav-btn.on{box-shadow:inset 0 -3px 0 var(--emerald)}
}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.tiles{grid-template-columns:minmax(0,1fr)}}

.tile .tl-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}

.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}

.review-grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1150px){.review-grid{grid-template-columns:minmax(0,1fr)}}
.rv{display:grid;gap:14px}
.rv-photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.rv-photos{grid-template-columns:minmax(0,1fr)}}
.rv-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.rv-meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rv-meta div{padding:10px 12px;border-radius:12px;background:var(--surface-2);min-width:0}
.rv-meta span{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:block}
.rv-meta b{font-size:13.5px;display:block;margin-top:2px}
.ck-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px}
@media (max-width:620px){.ck-grid{grid-template-columns:minmax(0,1fr)}}
.ck-res{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 0}

.action-box{padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;gap:10px}
.qr-chips{display:flex;gap:6px;flex-wrap:wrap}
.qr-chips button{border:1px dashed var(--line);background:var(--surface-2);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink-2)}
.qr-chips button:hover{border-color:var(--rose);color:var(--rose-txt)}
.matrix td.cell{padding:6px}
.cell-btn{border:0;border-radius:9px;padding:6px 8px;font-size:11.5px;font-weight:700;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.lb-row{display:grid;grid-template-columns:24px 36px minmax(0,1fr) 120px 52px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}

.lb-row .rk{font-weight:800;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.lb-row b{display:block;font-size:13.5px}

@media (max-width:560px){.lb-row{grid-template-columns:24px 36px minmax(0,1fr) 52px}.lb-row .bar{display:none}}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ring-box{display:grid;justify-items:center;gap:6px;text-align:center;padding:12px 6px;border-radius:14px;background:var(--surface-2)}

.ring-bg{stroke:var(--surface-3)}

.score-hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.score-big{font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.grade{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;font-weight:800;font-size:22px}
.floor-tg{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 10px;font-weight:700;font-size:12px;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.floor-tg.on{background:var(--emerald-soft);border-color:color-mix(in srgb,var(--emerald) 50%,var(--line));color:var(--emerald-txt)}
.weight-row{display:grid;grid-template-columns:minmax(0,1fr) 200px 60px;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}

@media (max-width:640px){.weight-row{grid-template-columns:minmax(0,1fr) 60px}.weight-row input{grid-column:1/-1;grid-row:2}}
input[type=range]{accent-color:var(--emerald);width:100%}

.sop-card{padding:16px;display:grid;gap:10px;text-align:left;width:100%;transition:transform .15s,box-shadow .15s}

.stepper{display:flex;gap:4px;margin:4px 0 14px}

.step-big{padding:20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}

.kv-list{display:flex;flex-wrap:wrap;gap:6px}
.kv-list span{font-size:12px;padding:5px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-weight:600;color:var(--ink-2)}

.narr div{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;max-width:75ch}

.toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:120;display:grid;gap:8px;width:min(420px,calc(100% - 32px));pointer-events:none}

/* ---------- login & account ---------- */
input[type=password]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}

.login-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px 16px}
.login-brand-m{display:none;align-self:center;margin-bottom:4px}
.login-card{width:100%;max-width:400px;padding:26px;display:grid;gap:14px;box-shadow:var(--shadow)}

.login-card label,.pwd-form label{font-size:12px;font-weight:700;color:var(--muted);display:grid;gap:6px}
label.check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2)}
label.check input{width:16px;height:16px;accent-color:var(--emerald)}
.pw-wrap{position:relative;display:block}

.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}

// ---------- charts ----------
function lineChart({labels, series, h = 230, lo = null}) {
  const W = 640, H = h, pl = 36, pr = 16, pt = 16, pb = 28, iw = W - pl - pr, ih = H - pt - pb;
  const vals = series.flatMap(s => s.values.filter(v => v != null));
  if (lo == null) lo = Math.max(0, Math.floor((Math.min(...vals, 100) - 4) / 10) * 10);
  const hi = 100, step = hi - lo > 50 ? 20 : 10;
  const y = v => pt + ih * (1 - (v - lo) / (hi - lo));
  const x = i => pl + (labels.length === 1 ? iw / 2 : i * iw / (labels.length - 1));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for (let v = lo; v <= hi; v += step) s += `<line class="ch-g" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-t" x="${pl - 8}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`;
  labels.forEach((l, i) => s += `<text class="ch-t" x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`);
  series.forEach(se => {
    const pts = se.values.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean);
    if (!pts.length) return;
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    if (se.area) s += `<path d="${d} L${pts[pts.length - 1][0]} ${pt + ih} L${pts[0][0]} ${pt + ih} Z" style="fill:${se.color};opacity:.12"/>`;
    s += `<path d="${d}" style="fill:none;stroke:${se.color};stroke-width:${se.w || 2.2};stroke-linejoin:round;stroke-linecap:round${se.dash ? ';stroke-dasharray:4 4' : ''}"/>`;
    const lp = pts[pts.length - 1];
    s += `<circle cx="${lp[0]}" cy="${lp[1]}" r="${se.area ? 5 : 3.5}" style="fill:${se.color};stroke:var(--surface);stroke-width:2"/>`;
    if (se.area) s += `<text class="ch-v" x="${lp[0] - 8}" y="${lp[1] - 10}" text-anchor="end">${Math.round(se.values[se.values.length - 1])}</text>`;
  });
  return s + '</svg>';
}
function barChart({labels, series, h = 220}) {
  const W = 640, H = h, pl = 36, pr = 10, pt = 14, pb = 28, iw = W - pl - pr, ih = H - pt - pb;
  const n = labels.length, band = iw / n, gw = band * (series.length > 1 ? .78 : .6), bw = gw / series.length;
  const y = v => pt + ih * (1 - v / 100);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  [0, 25, 50, 75, 100].forEach(v => s += `<line class="ch-g" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-t" x="${pl - 8}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`);
  labels.forEach((l, i) => {
    series.forEach((se, j) => { const v = se.values[i]; if (v == null) return; const x0 = pl + i * band + (band - gw) / 2 + j * bw; s += `<rect x="${x0 + .8}" y="${y(v)}" width="${Math.max(1, bw - 1.6)}" height="${pt + ih - y(v)}" rx="2.5" style="fill:${se.colorFn ? se.colorFn(v) : se.color}"><title>${esc(l)} · ${se.name}: ${Math.round(v)}</title></rect>`; });
    s += `<text class="ch-t" x="${pl + i * band + band / 2}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`;
  });
  return s + '</svg>';
}

function validate(t) {
  const sop = SOP[AREA_MAP[t.areaId].type], miss = [];
  const lastRej = [...t.reviews].reverse().find(r => r.verdict === 'rejected');
  if (!photos(t, 'before').length) miss.push('Foto Before');
  const sd = sop.steps.filter((_, i) => t.steps[i]).length; if (sd < sop.steps.length) miss.push(`Langkah SOP (${sd}/${sop.steps.length})`);
  const cd = sop.checklist.filter(c => t.checklist[c.id]).length; if (cd < sop.checklist.length) miss.push(`Checklist (${cd}/${sop.checklist.length})`);
  if (sop.checklist.some(c => t.checklist[c.id] === 'no') && !t.notes.trim()) miss.push('Catatan untuk item “Tidak”');
  const af = photos(t, 'after');
  if (!af.length) miss.push('Foto After');
  else if (lastRej && !af.some(p => p.ts > lastRej.at)) miss.push('Foto After baru setelah revisi');
  return miss;
}

function blockCheck() {

function postponeTask(t, u, to) {
  const err = blockCheck(); if (err) return toast(err, 'err');
  if (!/^\d{2}:\d{2}$/.test(to)) return toast('Pilih jam tunda.', 'err');
  if (atToday(to) <= Date.now()) return toast('Jam tunda harus setelah jam sekarang.', 'err');
  if (to > '23:00') return toast('Jam tunda paling lambat 23:00. Pilih "Lewati jadwal ini" bila tidak bisa hari ini.', 'err');
  if (postponeCount(t) >= MAX_POSTPONE) return toast(`Jadwal ini sudah ditunda ${MAX_POSTPONE} kali.`, 'err');
  const win = SOP[AREA_MAP[t.areaId].type].window || 60;
  t.postponed = [...(t.postponed || []), {at:Date.now(), by:u.id, reason:S.ui.blkReason, note:(S.ui.blkNote || '').trim(), from:t.due, to}];
  t.origDue = t.origDue || t.due; t.resched = to; t.due = addMin(to, win); t.by = t.by || u.id;
  S.ui.blockOpen = false; S.ui.blkReason = null; S.ui.blkNote = '';
  save(); renderModal(); toast(`Ditunda ke ${to}. Batas kirim baru ${t.due}.`);
}
function skipTask(t, u) {

// ---------- camera: real device camera when the browser allows it, simulated scene otherwise ----------
let CAM = null;
const coverCrop = (w, h) => { const r = 640 / 480; return w / h > r ? [(w - h * r) / 2, 0, h * r, h] : [0, (h - w / r) / 2, w, w / r]; };
// Photos can only come from the live camera (no gallery upload). If the camera can't open, a simulated scene is offered
// only while the Super Admin keeps "Kamera simulasi (demo)" on in Master Data; otherwise the shutter stays disabled.
// Default (no explicit setting): simulation only where a real camera can't work anyway — the Claude preview, this
// computer (localhost / file) — and never on a real deployment such as GitHub Pages.
const SIM_DEFAULT = /claude|localhost|127\.0\.0\.1|^$/.test(location.hostname) || location.protocol === 'file:';
const simCamAllowed = () => S.master.simCam ?? SIM_DEFAULT;
function openCamera(taskId, kind, facing = 'environment') {
  const t = taskById(taskId), u = me(), a = AREA_MAP[t.areaId];
  CAM = {taskId, kind, raf:0, result:null, stream:null, live:false, facing, reason:'', sceneSeed:hash(taskId + kind + Date.now()), scene:null, meta:{staff:u.name, loc:locLabel(a), kind, taskId}};
  const sc = document.createElement('canvas'); sc.width = 660; sc.height = 500;
  drawScene(sc.getContext('2d'), 660, 500, a.type, kind === 'before', CAM.sceneSeed); CAM.scene = sc;
  $('#cam-root').innerHTML = `<div class="cam" role="dialog" aria-modal="true" aria-label="Kamera">
    <div class="cam-top"><button class="cam-x" data-act="cam-close" aria-label="Tutup kamera">${ic('x')}</button><div class="t">Foto ${kind === 'before' ? 'Before' : 'After'}<small>${esc(locLabel(a))}</small></div><span class="live" id="cam-live">MEMBUKA…</span></div>
    <div class="cam-view"><div class="cam-frame"><video id="cam-video" playsinline muted autoplay></video><canvas id="cam-canvas" width="640" height="480"></canvas><img id="cam-result" alt="Hasil foto" hidden><span class="brk tl"></span><span class="brk tr"></span><span class="brk bl"></span><span class="brk br"></span><div class="cam-flash" id="cam-flash"></div></div></div>
    <div class="cam-hint" id="cam-hint">${ic('stamp','ic-sm')}Watermark real-time: waktu perangkat, nama staf, lokasi, status</div>
    <div class="cam-ctrl" id="cam-ctrl">
      <button class="cam-side" data-act="cam-retry" id="cam-retry" title="Coba buka kamera lagi" aria-label="Coba buka kamera lagi" hidden>${ic('refresh-cw')}</button><span class="cam-side cam-spacer" id="cam-spacer" aria-hidden="true"></span>
      <button class="shutter" data-act="cam-shot" id="cam-shot" aria-label="Ambil foto" disabled></button>
      <button class="cam-side" data-act="cam-flip" id="cam-flip" title="Ganti kamera depan/belakang" aria-label="Ganti kamera depan atau belakang" hidden>${ic('switch-camera')}</button><span class="cam-side cam-spacer" id="cam-spacer2" aria-hidden="true"></span>
    </div>
    <div class="cam-review" id="cam-review" hidden><button class="btn btn-ghost" data-act="cam-retake">${ic('rotate-ccw','ic-sm')}Ulangi</button><button class="btn btn-ghost" data-act="cam-use-more" id="cam-more">${ic('camera','ic-sm')}Simpan & foto lagi</button><button class="btn btn-primary" data-act="cam-use">${ic('check','ic-sm')}Simpan</button></div>
  </div>`;
  icons();
  loopCam(); startStream();
}
async function startStream() {
  const cam = CAM; if (!cam) return;
  if (!navigator.mediaDevices?.getUserMedia || !window.isSecureContext) {
    return camFallback('Kamera hanya bisa dibuka di alamat https://. Buka aplikasi lewat link https (mis. GitHub Pages).', false);
  }
  try {
    const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:cam.facing}, width:{ideal:1280}, height:{ideal:960}}, audio:false});
    if (CAM !== cam) { s.getTracks().forEach(tr => tr.stop()); return; }
    cam.stream = s; const v = $('#cam-video'); v.srcObject = s; await v.play();
    cam.live = true;
    $('#cam-live').textContent = 'LIVE'; $('#cam-live').classList.remove('sim');
    $('#cam-flip').hidden = false; $('#cam-spacer2').hidden = true; $('#cam-shot').disabled = false;
  } catch (e) {
    if (CAM !== cam) return;
    camFallback(e.name === 'NotAllowedError' ? 'Izin kamera ditolak. Ketuk ikon di samping alamat situs → Izin → Kamera → Izinkan, lalu tekan tombol coba lagi.' : 'Kamera tidak bisa dibuka. Pastikan kamera tidak sedang dipakai aplikasi lain, lalu tekan tombol coba lagi.', true);
  }
}
function camFallback(reason, canRetry) {
  if (!CAM) return;
  CAM.reason = reason;
  const sim = simCamAllowed(), l = $('#cam-live'), h = $('#cam-hint');
  if (l) { l.textContent = sim ? 'SIMULASI' : 'KAMERA MATI'; l.classList.add('sim'); }
  if (h) { h.innerHTML = `${ic('info','ic-sm')}${esc(reason)}${sim ? ' Sementara memakai kamera simulasi (mode demo).' : ''}`; icons(); }
  $('#cam-shot').disabled = !sim;
  if (canRetry) { $('#cam-retry').hidden = false; $('#cam-spacer').hidden = true; }
}
function stopStream() { CAM?.stream?.getTracks().forEach(tr => tr.stop()); if (CAM) { CAM.stream = null; CAM.live = false; } }
function loopCam() {
  const cv = $('#cam-canvas'); if (!cv || !CAM) return;
  const ctx = cv.getContext('2d'), v = $('#cam-video');
  if (CAM.live && v && v.readyState >= 2 && v.videoWidth) {
    const [sx, sy, sw, sh] = coverCrop(v.videoWidth, v.videoHeight);
    ctx.drawImage(v, sx, sy, sw, sh, 0, 0, 640, 480);
  } else {
    const t = performance.now() / 1000;
    ctx.drawImage(CAM.scene, -10 + Math.sin(t * 1.7) * 3, -10 + Math.cos(t * 1.3) * 2.5);
    ctx.fillStyle = `rgba(255,255,255,${.02 + Math.random() * .025})`; ctx.fillRect(0, 0, 640, 480);

}
function captureFrom(src, sx, sy, sw, sh, meta = CAM.meta) {
  const c = document.createElement('canvas'); c.width = 640; c.height = 480; const ctx = c.getContext('2d');
  ctx.drawImage(src, sx, sy, sw, sh, 0, 0, 640, 480);
  const ts = Date.now(); drawWatermark(ctx, 640, 480, {...meta, ts});
  return {url:c.toDataURL('image/jpeg', .78), ts};
}
function showCamResult() {
  const v = $('#cam-video'), live = CAM.live && v?.videoWidth;
  if (!live && !simCamAllowed()) return toast('Kamera belum terbuka. Izinkan akses kamera dulu.', 'err');
  cancelAnimationFrame(CAM.raf);
  const res = live ? captureFrom(v, ...coverCrop(v.videoWidth, v.videoHeight)) : captureFrom(CAM.scene, 10, 10, 640, 480);
  if (!live) res.sim = true;
  stopStream();
  CAM.result = res;
  const more = $('#cam-more'), tk = taskById(CAM.taskId); if (more) more.hidden = !tk || photos(tk, CAM.kind).length + 1 >= MAX_PHOTOS;
  const im = $('#cam-result'); im.src = res.url; im.hidden = false; $('#cam-canvas').hidden = true;
  $('#cam-ctrl').hidden = true; $('#cam-review').hidden = false; $('#cam-live').hidden = true;
  document.querySelectorAll('.brk').forEach(b => b.hidden = true);
  const fl = $('#cam-flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
}
function closeCamera() { if (CAM) { cancelAnimationFrame(CAM.raf); stopStream(); } CAM = null; $('#cam-root').innerHTML = ''; }

    case 'open-sop': S.ui.sopStep = 0; openModal({type:'sop', k:el.dataset.k}); return;
    case 'sop-step': S.ui.sopStep += +el.dataset.d; renderModal(); return;
    case 'sop-go': S.ui.sopStep = +el.dataset.i; renderModal(); return;
    case 'step': if (!t) return; t.steps[+el.dataset.i] = !t.steps[+el.dataset.i]; if (t.status === 'pending') { t.status = 'in_progress'; t.startedAt = Date.now(); } t.by = t.by || u.id; save(); renderModal(); return;
    case 'ck': if (!t) return; t.checklist[el.dataset.k] = el.dataset.v; if (t.status === 'pending') { t.status = 'in_progress'; t.startedAt = Date.now(); } t.by = t.by || u.id; save(); renderModal(); return;
    case 'cam': if (!t) return; if (photos(t, el.dataset.kind).length >= MAX_PHOTOS) return toast(`Maksimal ${MAX_PHOTOS} foto. Hapus salah satu dulu.`, 'err'); openCamera(t.id, el.dataset.kind); return;
    case 'ph-del': {
      if (!t || !confirm2(el, 'Klik ikon hapus sekali lagi untuk menghapus foto ini')) return;
      const arr = photos(t, el.dataset.kind); arr.splice(+el.dataset.i, 1); t[el.dataset.kind] = [...arr];
      save(); renderModal(); toast('Foto dihapus'); return;
    }
    case 'cam-use-more': if (CAM?.result) useCamPhoto(true); return;
    case 'cam-shot': if (CAM) showCamResult(); return;
    case 'cam-retake': case 'cam-retry': if (CAM) { const {taskId, kind, facing} = CAM; closeCamera(); openCamera(taskId, kind, facing); } return;
    case 'cam-flip': if (CAM) { const {taskId, kind, facing} = CAM; closeCamera(); openCamera(taskId, kind, facing === 'environment' ? 'user' : 'environment'); } return;
    case 'cam-use': if (CAM?.result) useCamPhoto(); return;
    case 'cam-close': closeCamera(); return;
    case 'zoom': { const [id, k, i] = el.dataset.src.split('|'); const tk = taskById(id); if (!tk || !canSeeTask(u, tk)) return; const p = photos(tk, k)[+i || 0]; if (!p) return; $('#zoom-root').innerHTML = `<div class="zoom" data-act="unzoom"><img src="${photoURL(p)}" alt="Foto ${k}"></div>`; return; }
    case 'unzoom': $('#zoom-root').innerHTML = ''; return;
    case 'submit-task': {
      if (!t || validate(t).length) return;
      const now = Date.now(); t.status = 'submitted'; t.submittedAt = now; t.firstSubmittedAt = t.firstSubmittedAt || now; t.by = t.by || u.id;
      save(); closeModal(); toast(atToday(t.due) < now && t.firstSubmittedAt === now ? 'Terkirim (melewati batas waktu)' : 'Terkirim ke supervisor untuk inspeksi'); return;
    }
    case 'rv-select': S.ui.reviewSel = el.dataset.id; S.ui.rvNote = ''; render(); return;
    case 'rv-floor': S.ui.reviewFloor = el.dataset.k; S.ui.reviewSel = null; render(); return;
    case 'qr': { const ta = $('#rv-note'); const v = ta.value.trim(); ta.value = v ? v.replace(/\.?$/, '. ') + el.dataset.k + '.' : el.dataset.k + '.'; S.ui.rvNote = ta.value; ta.focus(); return; }
    case 'approve': case 'reject': {
      if (u.role !== 'supervisor') return toast('Hanya supervisor yang dapat approve/reject.', 'err');
      const tk = taskById(el.dataset.id), note = ($('#rv-note')?.value || '').trim();
      if (act === 'reject' && !note) { toast('Tulis catatan revisi supaya staf tahu yang perlu diperbaiki.', 'err'); $('#rv-note')?.focus(); return; }
      tk.reviews.push({by:u.id, at:Date.now(), verdict:act === 'approve' ? 'approved' : 'rejected', note:note || (act === 'approve' ? 'Bersih, sesuai SOP.' : '')});
      tk.status = act === 'approve' ? 'approved' : 'rejected';
      S.ui.rvNote = ''; save();
      toast(act === 'approve' ? `Disetujui: ${locLabel(AREA_MAP[tk.areaId])}` : `Dikembalikan ke ${userById(tk.by)?.name.split(' ')[0] || 'staf'} untuk revisi`, act === 'approve' ? 'ok' : 'err');
      if (S.modal) closeModal(); else { S.ui.reviewSel = null; render(); }
      return;
    }
    case 'floor-tab': S.ui.floorTab = el.dataset.k; render(); return;
    case 'report-staff': S.ui.reportStaff = el.dataset.k; render(); return;
    case 'toggle-floor': {
      const x = userById(el.dataset.uid), f = el.dataset.k;
      x.floors = x.floors.includes(f) ? x.floors.filter(y => y !== f) : [...x.floors, f].sort();
      save(); render(); toast(`Akses ${x.name.split(' ')[0]} diperbarui: ${floorsLabel(x)}`); return;
    }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.mdf) { mdField(el); return; }
  if (/^w-[cap]$/.test(el.id)) { S.weights[el.id[2]] = +el.value; save(); render(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'task-notes') { const t = taskById(S.modal?.id); if (t) { t.notes = el.value; save(); clearTimeout(window.__nt); window.__nt = setTimeout(renderModal, 600); } }
  if (el.id === 'rv-note') S.ui.rvNote = el.value;
  if (el.id === 'blk-note') S.ui.blkNote = el.value;
  if (el.id === 'um-q') { S.ui.umQ = el.value; const q = el.value.toLowerCase(); document.querySelectorAll('tr[data-q]').forEach(tr => tr.hidden = !!q && !tr.dataset.q.includes(q)); }
  if (/^w-[cap]$/.test(el.id)) { const l = document.querySelector(`[data-wlabel="${el.id[2]}"]`); if (l) l.textContent = el.value + '%'; }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const fm = e.target;
  if (fm.id === 'login-form') { doLogin(); return; }
  const u = me(); if (!u) return;
  if (fm.id === 'pwd-form') { savePassword(u); return; }
  if (u.role !== 'superadmin') return;
  if (mdSubmit(fm)) return;
  umSubmit(fm);
});
function savePassword(u) {
  const m = S.modal, x = userById(m.uid), self = x.id === u.id;
  const p1 = $('#pw-new').value, p2 = $('#pw-new2').value;
  const fail = msg => { S.ui.pwErr = msg; renderModal(); $('#pw-new')?.focus(); };
  if (!self && u.role !== 'superadmin') return fail('Hanya Super Admin yang dapat me-reset password pengguna lain.');
  if (self && !m.forced && !checkPw(x, $('#pw-cur').value)) return fail('Password saat ini salah.');
  if (p1.length < 6) return fail('Password baru minimal 6 karakter.');
  if (p1 !== p2) return fail('Ulangan password tidak sama.');
  if (self && checkPw(x, p1)) return fail('Password baru harus berbeda dari password lama.');
  x.pw = hashPw(p1); x.demo = false;
  x.mustChange = self ? false : $('#pw-must').checked;
  if (!self) LAST_CRED = {name:x.name, username:x.username, password:p1, must:x.mustChange};
  S.modal = null; S.ui.pwErr = ''; save(); render();
  toast(self ? 'Password berhasil diganti' : `Password ${x.name} di-reset`);
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.ui.userMenu) { S.ui.userMenu = false; render(); return; }
  if ($('#zoom-root').innerHTML) { $('#zoom-root').innerHTML = ''; return; }
  if (CAM) { closeCamera(); return; }
  if (S.modal && !S.modal.forced) closeModal();
});

// ---------- boot ----------
setInterval(tickClock, 1000);
setInterval(() => { if (!S.modal && !CAM && !S.ui.userMenu && !document.activeElement?.matches('input,textarea,select')) render(); }, 60000);
{ const sid = getSession(), su = sid && userById(sid); S.user = su && isActive(su) ? sid : null; }
reconcileTasks(); save(); // align today's schedule with the master data (e.g. after a schedule-type change)
render();
if (document.fonts?.ready) document.fonts.ready.then(() => { PHOTO_CACHE.clear(); render(); });
window.addEventListener('load', icons);
</script>
